app-id: com.anthropic.Claude
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
# Provides zypak (Chromium sandbox inside Flatpak), libsecret, libnotify, etc.
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: claude-desktop
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  # Wayland first, X11 only when Wayland is unavailable
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # GPU acceleration
  - --device=dri
  # Project folders for Claude Code and file attachments
  - --filesystem=home
  # Notifications and tray icon
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # Keyring, so the sign-in persists (GNOME Keyring / KDE Wallet)
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6

modules:
  - name: claude-desktop
    buildsystem: simple
    # Prebuilt binaries: don't strip or split out debuginfo
    build-options:
      no-debuginfo: true
      strip: false
    build-commands:
      # Unpack the official Debian package
      - ar x claude-desktop.deb
      - tar -xf data.tar.xz

      # Application (ships its own Electron runtime)
      - cp -a usr/lib/claude-desktop /app/lib/claude-desktop
      # setuid sandbox helper is unusable in Flatpak; zypak replaces it
      - rm -f /app/lib/claude-desktop/chrome-sandbox

      # Launcher
      - install -Dm755 claude-desktop.sh /app/bin/claude-desktop

      # Icons, renamed to the app ID
      - |
        for size in 16 32 48 128 256; do
          install -Dm644 usr/share/icons/hicolor/${size}x${size}/apps/claude-desktop.png \
            /app/share/icons/hicolor/${size}x${size}/apps/com.anthropic.Claude.png
        done

      # Desktop entry from the package, pointed at the renamed icon
      - install -Dm644 usr/share/applications/com.anthropic.Claude.desktop
        /app/share/applications/com.anthropic.Claude.desktop
      - desktop-file-edit --set-icon=com.anthropic.Claude /app/share/applications/com.anthropic.Claude.desktop

      # MIME types for .mcpb, .dxt and .skill files
      - install -Dm644 usr/lib/claude-desktop/resources/linux-mime/com.anthropic.Claude.xml
        /app/share/mime/packages/com.anthropic.Claude.xml

      - install -Dm644 com.anthropic.Claude.metainfo.xml /app/share/metainfo/com.anthropic.Claude.metainfo.xml

    sources:
      - type: file
        url: https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_3.6556.1_amd64.deb
        sha256: ced5179997fdb90219e866685c7f3bcfcb494514d82022e27c89b28a371dfe87
        dest-filename: claude-desktop.deb
        only-arches: [x86_64]
      - type: file
        url: https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_3.6556.1_arm64.deb
        sha256: 488aff13fa0488c70cae41280f2d84827e1dc092e3082fb987554da2de06dcda
        dest-filename: claude-desktop.deb
        only-arches: [aarch64]
      - type: script
        dest-filename: claude-desktop.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/lib/claude-desktop/claude-desktop --ozone-platform-hint=auto
            --enable-features=WaylandWindowDecorations "$@"
      - type: file
        path: com.anthropic.Claude.metainfo.xml
